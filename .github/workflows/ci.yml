name: Video Studio CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  video-foundation:
    name: Windows Python 3.13 + React/Edge
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python media and ChatGPT dependencies
        run: python -m pip install -e ".[media,chatgpt]"
      - name: Verify installed Python package from outside source tree
        shell: pwsh
        run: |
          Push-Location $env:RUNNER_TEMP
          try {
            python -c "import agentforge, os; from pathlib import Path; from agentforge.paths import REPOSITORY_ROOT; assert Path(agentforge.__file__).resolve().parent == REPOSITORY_ROOT / 'agentforge'; assert REPOSITORY_ROOT == Path(os.environ['GITHUB_WORKSPACE']).resolve()"
            if ($LASTEXITCODE -ne 0) { throw "Python package import failed" }
          } finally { Pop-Location }
      - name: Install Python static audit tool (CI only)
        run: python -m pip install ruff==0.11.13
      - name: Python undefined-name gate
        run: python -m ruff check agentforge scripts tests --select F821,F822,F823 --output-format concise
      - name: Python unused-import and variable gate
        run: python -m ruff check agentforge scripts tests --select F401,F841 --output-format concise
      - name: Compile all Python modules
        run: python -m compileall -q agentforge tests
      - name: Validate Markdown links
        run: python scripts/check_docs.py
      - name: Verify tracked-file hygiene
        run: python scripts/check_source_hygiene.py
      - name: Run all video foundation regressions
        run: python -m unittest discover -s tests -v
      - name: Run read-only Owner acceptance
        shell: powershell
        run: .\scripts\agentforge_acceptance_windows.ps1
      - name: Run FFmpeg fixture (real encode/decode, no model)
        run: python -B -m agentforge.ops.runtime_certification --run-ffmpeg --confirm-local-exec
      - name: Install FFmpeg and ffprobe for cloud E2E
        shell: pwsh
        run: |
          if (-not (Get-Command ffprobe -ErrorAction SilentlyContinue) -or -not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "FFmpeg installation failed" }
          }
          python -c "from agentforge.features.media.render import find_media_tool; assert all(find_media_tool(t) for t in ('ffmpeg','ffprobe')), 'Missing FFmpeg/ffprobe'"
      - name: Run cloud video integration with real media tools
        run: python -m unittest tests.test_v5_cloud_motion -v
      - name: Run no-inference Owner preflight wrapper
        shell: powershell
        run: .\scripts\agentforge_runtime_certify_windows.ps1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Dashboard dependencies
        working-directory: dashboard
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Dashboard dead-code and dependency inventory
        working-directory: dashboard
        run: npm exec --yes --package=knip@5.46.0 --package=typescript@5.8.3 -- knip --no-exit-code
      - name: Dashboard unit checks
        working-directory: dashboard
        run: npm run test:navigation
      - name: Dashboard production build
        working-directory: dashboard
        run: npm run build
      - name: Dashboard initial bundle and lazy screen gate
        working-directory: dashboard
        run: node tests/build-layout.mjs
      - name: Dashboard Edge browser smoke
        working-directory: dashboard
        run: npm run test:browser
      - name: Dashboard asset security
        run: python -m unittest tests.test_dashboard_static -v
