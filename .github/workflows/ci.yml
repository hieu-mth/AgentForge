name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests (Windows, Python 3.13)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install project
        run: python -m pip install -e ".[media]"

      - name: Validate Control Center browser script
        run: node --check src/agentforge/control_center_static/app.js

      - name: Test Control Center frontend actions
        run: node --test tests/test_control_center_task_detail.cjs tests/test_control_center_v11.cjs

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
