name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests (Windows, Python 3.13)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install project
        run: python -m pip install -e ".[media]"

      - name: Validate Control Center browser script
        run: node --check src/agentforge/control_center_static/app.js

      - name: Test Control Center frontend actions
        run: node --test tests/test_control_center_task_detail.cjs tests/test_control_center_v11.cjs tests/test_ops_control_ui.cjs

      - name: Setup Node for standalone React Dashboard
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install React Dashboard dependencies
        working-directory: ui/dashboard
        run: npm install --no-audit --no-fund

      - name: Validate compact React navigation
        working-directory: ui/dashboard
        run: npm run test:navigation

      - name: Build React Dashboard (Ant Design)
        working-directory: ui/dashboard
        run: npm run build

      - name: Validate built dashboard routing and assets
        run: python -m unittest tests.test_react_dashboard_v27 -v

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Smoke-test read-only owner acceptance (PowerShell 5.1)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/agentforge_acceptance_windows.ps1
