name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests (Windows, Python 3.13)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install project
        run: python -m pip install -e ".[media]"

      - name: Verify installed package from outside the repository
        shell: pwsh
        run: |
          Push-Location $env:RUNNER_TEMP
          try {
            python -c "import os; from pathlib import Path; import agentforge; from agentforge import paths; root=Path(os.environ['GITHUB_WORKSPACE']).resolve(); assert paths.REPOSITORY_ROOT.resolve()==root; assert Path(agentforge.__file__).resolve().parent== (root/'agentforge').resolve()"
            if ($LASTEXITCODE -ne 0) { throw "Flat Python package import failed outside checkout" }
          } finally { Pop-Location }

      - name: Verify wheel contains root agentforge package only
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'agentforge-wheel'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          python -m pip wheel . --no-deps --wheel-dir $out
          if ($LASTEXITCODE -ne 0) { throw "Python wheel build failed" }
          $wheels = @(Get-ChildItem -Path $out -Filter 'agentforge-*.whl')
          if ($wheels.Count -ne 1) { throw "Expected exactly one AgentForge wheel" }
          python -c "import sys,zipfile; files=zipfile.ZipFile(sys.argv[1]).namelist(); assert 'agentforge/__main__.py' in files; assert 'agentforge/paths.py' in files; assert not any(p.startswith(('src/','dashboard/','tests/')) for p in files)" $wheels[0].FullName
          if ($LASTEXITCODE -ne 0) { throw "Wheel incorrectly includes non-package content or lacks modules" }

      - name: Validate documentation links
        run: python scripts/check_docs.py

      - name: Audit retained compatibility imports (read-only)
        run: python scripts/compat_audit.py --check

      - name: Setup Node for standalone React Dashboard
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install React Dashboard dependencies
        working-directory: dashboard
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate compact React navigation
        working-directory: dashboard
        run: npm run test:navigation

      - name: Build React Dashboard (Ant Design)
        working-directory: dashboard
        run: npm run build

      - name: Smoke-test React production boot in Microsoft Edge
        working-directory: dashboard
        run: npm run test:browser

      - name: Validate built dashboard routing and assets
        run: python -m unittest tests.test_react_dashboard_v27 -v

      - name: Install NovaMart reference dependencies
        working-directory: templates/novamart
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Test NovaMart interactive commerce logic
        working-directory: templates/novamart
        run: npm test

      - name: Build NovaMart reference React app
        working-directory: templates/novamart
        run: npm run build

      - name: Smoke-test M9 read-only Windows setup
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/setup_windows.ps1

      - name: Browser-test NovaMart interactions in Microsoft Edge
        working-directory: templates/novamart
        run: npm run test:browser

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Smoke-test read-only owner acceptance (PowerShell 5.1)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/agentforge_acceptance_windows.ps1
