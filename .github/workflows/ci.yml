name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests (Windows, Python 3.13)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install project
        run: python -m pip install -e ".[media]"

      - name: Validate documentation links
        run: python scripts/check_docs.py

      - name: Setup Node for standalone React Dashboard
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install React Dashboard dependencies
        working-directory: dashboard
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate compact React navigation
        working-directory: dashboard
        run: npm run test:navigation

      - name: Build React Dashboard (Ant Design)
        working-directory: dashboard
        run: npm run build

      - name: Smoke-test React production boot in Microsoft Edge
        working-directory: dashboard
        run: npm run test:browser

      - name: Validate built dashboard routing and assets
        run: python -m unittest tests.test_react_dashboard_v27 -v

      - name: Install NovaMart reference dependencies
        working-directory: examples/novamart
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Test NovaMart interactive commerce logic
        working-directory: examples/novamart
        run: npm test

      - name: Build NovaMart reference React app
        working-directory: examples/novamart
        run: npm run build

      - name: Browser-test NovaMart interactions in Microsoft Edge
        working-directory: examples/novamart
        run: npm run test:browser

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Smoke-test read-only owner acceptance (PowerShell 5.1)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/agentforge_acceptance_windows.ps1
