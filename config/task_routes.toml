# Local-first Video Studio routing. Assignment does not start model inference.
# Model selection is reviewed on the dashboard; GPU jobs require a separate
# signed Film Studio action and explicit Owner consent.

[routes."general.text"]
label = "LLM văn bản"
kind = "text"
execution = "config_only"
default_model = "local_primary"

[routes."film.storyboard"]
label = "Kịch bản và phân cảnh"
kind = "text"
execution = "config_only"
default_model = "local_primary"

[routes."film.motion"]
label = "Tạo video chuyển động"
kind = "video"
execution = "config_only"

[routes."image.generate"]
label = "Sinh hình ảnh"
kind = "image"
execution = "config_only"

[routes."ops.monitor"]
label = "Giám sát local (quy tắc)"
kind = "rules"
execution = "rules"
