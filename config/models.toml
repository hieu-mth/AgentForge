# Stable profile IDs. Change 'model', not the [models.<id>] name.

[models.local_primary]
provider = "ollama"
model = "qwen3:8b"
base_url = "http://127.0.0.1:11434"
enabled = true

[models.cloud_primary]
provider = "anthropic"
model = "claude/claude-sonnet-5-5"
base_url_env = "ANTHROPIC_BASE_URL"
api_key_env = "ANTHROPIC_AUTH_TOKEN"
enabled = true
