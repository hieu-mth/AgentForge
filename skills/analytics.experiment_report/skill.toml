schema_version = 1
id = "analytics.experiment_report"
version = "0.1.0"
description = "Compare two recorded content variants descriptively with uncertainty and no causal winner."
worker_id = "analytics_analyst"
execution_mode = "read_only"
required_permissions = ["workspace.read"]
required_tools = ["filesystem", "sqlite"]
artifact_types = ["experiment_report"]
quality_checks = ["variant_comparability", "uncertainty"]

[limits]
timeout_seconds = 30
estimated_model_calls = 0

[input_schema]
type = "object"
required = ["dataset", "campaign"]
additional_properties = false

[input_schema.properties]
dataset = "string"
campaign = "string"

[output_schema]
type = "object"
required = ["status", "dataset", "synthetic", "variants", "uncertainty", "causal_claim", "sources"]
additional_properties = true

[output_schema.properties]
status = "string"
dataset = "string"
synthetic = "boolean"
sources = "object"
variants = "object"
uncertainty = "array"
causal_claim = "boolean"
