schema_version = 1
id = "analytics.finance_report"
version = "0.1.0"
description = "Distinguish pending ledger amounts from owner-confirmed cash and verified profit."
worker_id = "analytics_analyst"
execution_mode = "read_only"
required_permissions = ["workspace.read"]
required_tools = ["filesystem", "sqlite"]
artifact_types = ["finance_report"]
quality_checks = ["ledger_integrity", "source_provenance"]

[limits]
timeout_seconds = 30
estimated_model_calls = 0

[input_schema]
type = "object"
required = ["dataset"]
additional_properties = false

[input_schema.properties]
dataset = "string"
campaign = "string"

[output_schema]
type = "object"
required = ["status", "dataset", "synthetic", "owner_confirmed_received_vnd", "owner_confirmed_paid_vnd", "owner_recorded_net_cash_vnd", "uncertainty", "sources"]
additional_properties = true

[output_schema.properties]
status = "string"
dataset = "string"
synthetic = "boolean"
sources = "object"
owner_confirmed_received_vnd = "integer"
owner_confirmed_paid_vnd = "integer"
owner_recorded_net_cash_vnd = "integer"
uncertainty = "array"
