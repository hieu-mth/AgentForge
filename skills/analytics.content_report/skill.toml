schema_version = 1
id = "analytics.content_report"
version = "0.1.0"
description = "Summarize recorded views, clicks, leads and orders with denominator-scoped rates and caveats."
worker_id = "analytics_analyst"
execution_mode = "read_only"
required_permissions = ["workspace.read"]
required_tools = ["filesystem", "sqlite"]
artifact_types = ["content_analysis_report"]
quality_checks = ["denominators", "source_provenance"]

[limits]
timeout_seconds = 30
estimated_model_calls = 0

[input_schema]
type = "object"
required = ["dataset"]
additional_properties = false

[input_schema.properties]
dataset = "string"
campaign = "string"

[output_schema]
type = "object"
required = ["status", "dataset", "synthetic", "metrics", "diagnostics", "uncertainty", "sources"]
additional_properties = true

[output_schema.properties]
status = "string"
dataset = "string"
synthetic = "boolean"
sources = "object"
metrics = "object"
diagnostics = "array"
uncertainty = "array"
