schema_version = 1
id = "terminal.check"
version = "0.1.0"
description = "Run the approved Python version diagnostic in an existing workspace directory."
worker_id = "product_builder"
execution_mode = "owner_gated"
required_permissions = ["process.run"]
required_tools = ["terminal"]
artifact_types = ["terminal_receipt"]
quality_checks = ["exit_code", "timeout"]

[limits]
timeout_seconds = 5
estimated_model_calls = 0

[input_schema]
type = "object"
required = ["recipe", "directory", "confirm_external_run"]
additional_properties = false

[input_schema.properties]
recipe = "string"
directory = "string"
confirm_external_run = "boolean"

[output_schema]
type = "object"
required = ["status", "recipe", "exit_code", "stdout", "stderr"]
additional_properties = false

[output_schema.properties]
status = "string"
recipe = "string"
exit_code = "integer"
stdout = "string"
stderr = "string"
