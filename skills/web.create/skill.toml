schema_version = 1
id = "web.create"
version = "0.1.0"
description = "Create a premium offline static website proposal for owner review."
worker_id = "product_builder"
execution_mode = "owner_gated"
required_permissions = ["model.invoke", "workspace.propose"]
required_tools = ["model", "filesystem"]
artifact_types = ["web_proposal", "static_html"]
quality_checks = ["static_html_check"]

[limits]
timeout_seconds = 240
estimated_model_calls = 1

[input_schema]
type = "object"
required = ["slug", "brief"]
additional_properties = false

[input_schema.properties]
slug = "string"
brief = "string"

[output_schema]
type = "object"
required = ["proposal_id", "project_slug", "sha256", "execution_authorized"]
additional_properties = true

[output_schema.properties]
proposal_id = "string"
project_slug = "string"
sha256 = "string"
execution_authorized = "boolean"
