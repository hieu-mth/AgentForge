schema_version = 1
id = "filesystem.revise_report"
version = "0.1.0"
description = "Create a new Markdown version from an exact SHA-verified source report."
worker_id = "product_builder"
execution_mode = "owner_gated"
required_permissions = ["workspace.read", "workspace.write"]
required_tools = ["filesystem"]
artifact_types = ["markdown_report"]
quality_checks = ["workspace_bounds", "readback_sha256"]

[limits]
timeout_seconds = 15
estimated_model_calls = 0

[input_schema]
type = "object"
required = ["path", "content", "source_path", "source_sha256", "source_task_id"]
additional_properties = false

[input_schema.properties]
path = "string"
content = "string"
source_path = "string"
source_sha256 = "string"
source_task_id = "string"

[output_schema]
type = "object"
required = ["status", "report_path", "sha256", "size_bytes", "source_task_id", "source_sha256"]
additional_properties = false

[output_schema.properties]
status = "string"
report_path = "string"
sha256 = "string"
size_bytes = "integer"
source_task_id = "string"
source_sha256 = "string"
