schema_version = 1
id = "analytics.quality_check"
version = "0.1.0"
description = "Review imported analytics evidence provenance, sample sizes, timestamps and data uncertainty."
worker_id = "analytics_analyst"
execution_mode = "read_only"
required_permissions = ["workspace.read"]
required_tools = ["filesystem", "sqlite"]
artifact_types = ["analytics_quality_report"]
quality_checks = ["source_provenance", "uncertainty"]

[limits]
timeout_seconds = 30
estimated_model_calls = 0

[input_schema]
type = "object"
required = ["dataset"]
additional_properties = false

[input_schema.properties]
dataset = "string"
campaign = "string"

[output_schema]
type = "object"
required = ["status", "dataset", "synthetic", "warnings", "sources"]
additional_properties = true

[output_schema.properties]
status = "string"
dataset = "string"
synthetic = "boolean"
sources = "object"
warnings = "array"
performance_rows = "integer"
ledger_rows = "integer"
