schema_version = 1
id = "media.quality_check"
version = "0.1.0"
description = "Read and validate S2 media checksums, PNG dimensions, PCM WAV, SRT and MP4 structure."
worker_id = "media_producer"
execution_mode = "read_only"
required_permissions = ["workspace.read"]
required_tools = ["filesystem"]
artifact_types = ["media_quality_report"]
quality_checks = ["asset_integrity", "caption_timing", "audio_duration", "video_structure"]

[limits]
timeout_seconds = 30
estimated_model_calls = 0

[input_schema]
type = "object"
required = ["run_id"]
additional_properties = false

[input_schema.properties]
run_id = "string"

[output_schema]
type = "object"
required = ["run_id", "status", "failures", "warnings", "findings"]
additional_properties = true

[output_schema.properties]
run_id = "string"
status = "string"
failures = "integer"
warnings = "integer"
findings = "array"
