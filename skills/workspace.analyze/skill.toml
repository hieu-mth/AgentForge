schema_version = 1
id = "workspace.analyze"
version = "0.1.0"
description = "Analyze Owner-scoped Markdown with adaptive local tool choices and verified report handoff."
worker_id = "opportunity_researcher"
execution_mode = "owner_gated"
required_permissions = ["workspace.read", "workspace.write", "model.invoke"]
required_tools = ["filesystem", "model"]
artifact_types = ["markdown_report"]
quality_checks = ["workspace_bounds", "evidence_refs", "readback_sha256"]

[limits]
timeout_seconds = 300
estimated_model_calls = 3

[input_schema]
type = "object"
required = ["path", "prompt", "directory"]
additional_properties = false

[input_schema.properties]
path = "string"
prompt = "string"
directory = "string"

[output_schema]
type = "object"
required = ["status", "report_path", "sha256", "size_bytes", "model", "trace", "citations_checked"]
additional_properties = false

[output_schema.properties]
status = "string"
report_path = "string"
sha256 = "string"
size_bytes = "integer"
model = "string"
trace = "array"
citations_checked = "integer"
