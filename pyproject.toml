[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agentforge"
version = "0.1.0"
description = "Local-first, human-controlled AI research and product prototyping"
requires-python = ">=3.13"
dependencies = [
    "langgraph==1.2.19",
    "langgraph-checkpoint-sqlite==3.1.3",
    "ddgs==9.16.1",
    "lxml==6.1.3",
    "python-dotenv==1.2.4",
    "tree-sitter==0.25.2",
    "tree-sitter-javascript==0.25.0"
]

[project.optional-dependencies]
# Explicit opt-in: local graphics + a bundled FFmpeg executable (~40 MB on Windows).
# Never install engines or fetch cloud assets from inside the running agent.
media = [
    "Pillow==13.0.0",
    "imageio-ffmpeg==0.8.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agentforge", "agentforge.*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".git", ".venv", "data", "workspace", "build", "dist"]
