[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agentforge"
version = "0.1.0"
description = "Local-first, owner-approved AI Video Studio"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
# Explicit opt-in: local graphics + a bundled FFmpeg executable (~40 MB on Windows).
# Never install engines or fetch cloud assets from inside the running agent.
media = [
    "Pillow==13.0.0",
    "imageio-ffmpeg==0.8.1",
]

chatgpt = ["PyJWT[crypto]>=2.10,<3"]

# Explicit consent only; NEVER installed by the default Dashboard setup.
youtube = [
    "google-api-python-client==2.201.0",
    "google-auth-oauthlib==1.5.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agentforge", "agentforge.*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".git", ".venv", "data", "workspace", "build", "dist"]
