[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agentforge"
version = "0.1.0"
description = "Local-first, human-controlled AI research and product prototyping"
requires-python = ">=3.13"
dependencies = [
    "langgraph==1.2.19",
    "langgraph-checkpoint-sqlite==3.1.3",
    "ddgs==9.16.1",
    "lxml==6.1.3",
    "python-dotenv==1.2.4"
]

[tool.setuptools.packages.find]
where = ["src"]
